# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono comes through rmcp (3.9 and 3.10 alike), which turns on
    # schemars's `chrono04` feature for its server and macros: volee cannot
    # turn it off. The advisory says chrono is unmaintained, not that it is
    # vulnerable. Drop this once rmcp moves to jiff or time.
    { id = "RUSTSEC-2026-0543", reason = "chrono comes through rmcp and schemars, which volee cannot change; unmaintained, not vulnerable" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
