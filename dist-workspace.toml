# dist (cargo-dist) builds the release artifacts when a `vX.Y.Z` tag is pushed.
# After any change here, run `dist generate` to regenerate
# .github/workflows/release.yml, and `dist plan` to check the result.
# The release procedure is in RELEASING.md.

[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# Pull requests only run `dist plan`: artifacts are built for tags only
pr-run-mode = "upload"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in: the first that applies of
# $XDG_BIN_HOME, $XDG_DATA_HOME/../bin and ~/.local/bin
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
# Whether to install an updater program
install-updater = false
# Where to host releases
hosting = "github"
# The checksum algorithm for the artifacts
checksum = "sha256"
# Packages are not distributed unless they opt in with `dist = true`
dist = false
