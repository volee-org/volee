[package]
name = "volee-cli"
description = "See, launch and coordinate every coding agent on your machine, from your terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "volee"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
tracing-subscriber.workspace = true
volee-config.workspace = true
volee-core.workspace = true
volee-daemon.workspace = true
volee-mcp.workspace = true
volee-proto.workspace = true
volee-store.workspace = true

[lints]
workspace = true
