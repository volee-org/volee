# volee configuration. Every setting is optional.
# Docs: https://volee-org.github.io/volee/guide/configuration.html

[agents]
# Model for the agents volee launches, unless a repository sets one.
# model = "opus"

# Permission mode passed to Claude Code: "acceptEdits", "auto", "manual",
# "dontAsk" or "plan". Unset: "manual", which asks before every tool that
# needs permission (never your own Claude Code default).
# permission_mode = "auto"

# How long, in seconds, an idle agent stays reachable by messages before
# volee stops waiting (Claude Code stops idle background sessions after about
# an hour anyway; volee then resumes them when a message arrives).
wake_timeout = 3600

# Agents run in volee hosts. When the machine restarts, the daemon resumes the
# agents it interrupted in new hosts, with their conversation, the first time
# it starts (`volee daemon install` starts it at login). false: they are
# shown as stopped and resume when you write to them.
# resume_after_reboot = true

# One table per repository volee may launch agents in. The key is the name you
# use on the command line and the name agents see.
#
# [repos.billing]
# path = "~/code/billing"
# base = "develop"         # the repository's default branch when unset
# model = "sonnet"         # overrides [agents] model for this repository
# setup = ["cp \"$VOLEE_REPO_ROOT/.env.local\" .", "bun install"]
#                          # prepares each new worktree before its agent starts

[messages]
# Summaries of long threads, written by a model when you ask for one
# (`volee summary <mission or agent>`). Off by default: each summary runs
# Claude Code with your account, usually for a few cents.
# summaries = true
# summary_model = "haiku"

[missions]
# The most agents one mission may launch besides its coordinator, counting
# those that already stopped. A coordinator asking for more is refused.
# max_workers = 8

[git]
# Which repositories the daemon fetches in the background (`git fetch --prune
# origin`, at most every five minutes), so push states and merges reflect the
# remote: "launched" (repositories of agents volee launched, the default),
# "all" (also those of sessions volee only discovered) or "never".
# fetch = "launched"

[tui]
# "catppuccin-mocha" (default), "catppuccin-macchiato", "catppuccin-frappe",
# "catppuccin-latte", "terminal", or the name of a file in
# ~/.config/volee/themes/ without its .toml extension.
# theme = "catppuccin-mocha"

# Stop animations: messages light up their line on the network instead of
# travelling along it, and spinners stop.
# reduced_motion = true

# Key overrides, by action name. See the interface guide for the actions.
# [tui.keys]
# take-over = "ctrl-a"

# Programs `o` offers to open an agent's worktree with. None is required:
# volee only offers what it finds. Each is a command line run in the
# worktree; {dir} is the worktree and {base} the branch the agent started
# from. "" turns a tool off.
# [tui.tools]
# editor = "nvim"                          # default: $VISUAL, then $EDITOR
# diff = "nvim -c 'DiffviewOpen {base}'"   # default: when diffview.nvim is installed
# git = "lazygit"                          # default: when lazygit is installed
# ide = "code {dir}"                       # default: when VS Code's `code` is installed
