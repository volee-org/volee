name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security problems, do not use this form: see the security policy.
  - type: input
    id: version
    attributes:
      label: volee version
      description: Output of `volee --version`.
      placeholder: volee 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and terminal
      description: For example macOS 15 with Ghostty, or Ubuntu 24.04 with kitty.
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
      placeholder: 2.1.0 (Claude Code)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `volee ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `~/.local/state/volee/logs`. Remove anything private first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
