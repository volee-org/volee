[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/volee-org/volee"
homepage = "https://volee-org.github.io/volee/"
authors = ["The volee contributors"]
keywords = ["agents", "claude-code", "tui", "worktree", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Internal crates.
volee-config = { path = "crates/volee-config", version = "0.1.0" }
volee-core = { path = "crates/volee-core", version = "0.1.0" }
volee-daemon = { path = "crates/volee-daemon", version = "0.1.0" }
volee-harness = { path = "crates/volee-harness", version = "0.1.0" }
volee-mcp = { path = "crates/volee-mcp", version = "0.1.0" }
volee-proto = { path = "crates/volee-proto", version = "0.1.0" }
volee-store = { path = "crates/volee-store", version = "0.1.0" }

# External crates. Keep this list sorted.
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
insta = { version = "1.49.0", features = ["json"] }
rmcp = { version = "3.9.0", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
ulid = "3.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they give in this code base.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Restriction lints we opt into.
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[profile.dist]
inherits = "release"
