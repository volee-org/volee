# git-cliff configuration: generates CHANGELOG.md from the commit history.
# https://git-cliff.org/docs/configuration
#
# Pull requests are squash-merged, so each commit on main is one pull request
# whose Conventional Commits title is the first line of the message. The
# changelog is regenerated in each release pull request (see RELEASING.md):
#
#   git cliff --tag vX.Y.Z -o CHANGELOG.md   # release: unreleased commits become vX.Y.Z
#   git cliff -o CHANGELOG.md                # refresh: only [Unreleased] changes
#
# The squash commit bodies hold whole pull request descriptions, so every rule
# below reads the first line only.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
It is generated from the commit history with [git-cliff](https://git-cliff.org):
see [RELEASING.md](RELEASING.md).

"""
# One section per release. The `<!-- n -->` prefix of a group name only sorts
# the groups in the Keep a Changelog order; `striptags` removes it.
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        {% set summary = commit.message | split(pat="\n") | first | trim -%}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
          {% if commit.breaking %}**Breaking:** {% endif %}\
          {% if commit.raw_message is starting_with("revert") %}Revert {{ summary }}\
          {% else %}{{ summary | upper_first }}{% endif %}\
    {% endfor %}
{% endfor %}\n
"""
# Link references for the version headings, as Keep a Changelog recommends.
# Each one is emitted with the newline before it, so the file ends with a
# single newline.
footer = """
{% for release in releases -%}
    {% if not loop.first %}{{ "\n" }}{% endif -%}
    {% if release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
        {% if release.previous and release.previous.version -%}
            https://github.com/volee-org/volee/compare/{{ release.previous.version }}...{{ release.version }}\
        {% else -%}
            https://github.com/volee-org/volee/releases/tag/{{ release.version }}\
        {% endif -%}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: https://github.com/volee-org/volee/compare/{{ release.previous.version }}...HEAD\
    {% else -%}
        [unreleased]: https://github.com/volee-org/volee/commits/main/\
    {% endif -%}
{% endfor -%}
"""
# Remove the template indentation.
trim = true

[git]
conventional_commits = true
# Drop commits that do not follow Conventional Commits (such as "Initial commit").
filter_unconventional = true
split_commits = false
# Turn the "(#123)" that GitHub appends to squash-merge titles into a link.
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/volee-org/volee/pull/${1}))" },
]
# Map Conventional Commits types to Keep a Changelog sections. The first
# matching rule wins; commits that match no rule are dropped.
commit_parsers = [
  # Release pull requests and dependency updates are not changes of their own.
  { message = '^chore(\(release\))?: release', skip = true },
  { message = '^(build|chore|ci)\(deps\)', skip = true },
  { message = '^(feat|fix)(\(.+\))?!?: deprecate', group = "<!-- 2 -->Deprecated" },
  { message = '^(feat|fix)(\(.+\))?!?: (remove|drop|delete)', group = "<!-- 3 -->Removed" },
  { message = '(?i)^fix(\(.+\))?!?: .*(security|vulnerab|cve-|ghsa-)', group = "<!-- 5 -->Security" },
  { message = '^feat', group = "<!-- 0 -->Added" },
  { message = '^fix', group = "<!-- 4 -->Fixed" },
  { message = '^(perf|revert)', group = "<!-- 1 -->Changed" },
  { message = '^docs', group = "<!-- 6 -->Documentation" },
  # Internal work is left out, unless it is a breaking change (see below).
  { message = '^(build|chore|ci|refactor|style|test)', group = "<!-- 1 -->Changed", skip = true },
]
# Keep breaking changes even when their type is left out above.
protect_breaking_commits = true
filter_commits = true
# Only stable versions get a section: the commits of a pre-release are listed
# under the stable version that follows it.
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
topo_order = false
sort_commits = "oldest"

[bump]
# While volee is 0.x: a feature bumps the minor version, a breaking change
# bumps the minor version too (not 1.0.0), a fix bumps the patch version.
features_always_bump_minor = true
breaking_always_bump_major = false
# The version `git cliff --bumped-version` suggests before the first release.
initial_tag = "v0.1.0"
